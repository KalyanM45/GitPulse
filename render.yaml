# Render blueprint for the GitPulse API (Docker).
#
# Render → New → Blueprint → point at this repo. Secrets are marked sync:false,
# so Render prompts for them instead of reading them from git.

services:
  - type: web
    name: gitpulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # Never commit these — Render asks for them on first deploy.
      - key: GITHUB_USERNAME
        sync: false
      - key: MONGODB_URI
        sync: false

      # Auth (Firebase). The project ID is public; ALLOWED_EMAILS limits who gets in.
      - key: FIREBASE_PROJECT_ID
        value: gitpulse2026
      # Invite-only program. ADMIN_EMAILS (your sign-in email) is entered in the
      # Render dashboard so it isn't published in this public repo.
      - key: ACCESS_MODE
        value: invite
      - key: ADMIN_EMAILS
        sync: false

      # Public read-only demo of this GitHub account's dashboard at /demo.
      - key: DEMO_GITHUB_LOGIN
        value: KalyanM45
      - key: DEMO_HIDE_PRIVATE_REPOS
        value: "true"

      # Email the admins when someone requests access (optional; see docs).
      - key: APP_URL
        value: https://gitpulse.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Encrypts users' GitHub tokens in MongoDB. Generated once; never change it
      # (or copy it into the GitHub Actions secret TOKEN_ENCRYPTION_KEY too).
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true

      - key: DB_NAME
        value: github_analytics
      - key: SYNC_INTERVAL_MINUTES
        value: "60"

      # Lock the API to the frontend's origin. Replace with your Vercel domain;
      # keep localhost so you can point a local frontend at the deployed API.
      - key: CORS_ORIGINS
        value: https://gitpulse.vercel.app,http://localhost:3000

# NOTE: Render's free plan spins the service down after ~15 minutes idle, and a
# cold start takes ~50s. The in-process APScheduler sync only runs while the
# service is awake, so on the free plan syncs will be irregular. Use a paid
# instance, or trigger POST /api/sync from an external cron, if that matters.
