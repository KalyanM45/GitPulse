name: Sync Workflow

on:
  schedule:
    - cron: '30 5 * * *'   # 11:00 AM IST
    - cron: '30 11 * * *'  #  5:00 PM IST
    - cron: '30 17 * * *'  # 11:00 PM IST
    - cron: '30 23 * * *'  #  5:00 AM IST
  workflow_dispatch:

jobs:
  sync:
    name: Sync all connected users
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run sync
        env:
          # Each user's GitHub token is stored encrypted in MongoDB; this key (the
          # same TOKEN_ENCRYPTION_KEY the API uses) decrypts them.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DB_NAME: ${{ secrets.DB_NAME }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          # Legacy single-user account: its pre-multi-user history goes to whoever connects it.
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        run: python scripts/sync.py
